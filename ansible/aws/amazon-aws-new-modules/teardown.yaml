---
# ansible/aws/amazon-aws-new-modules/teardown.yaml
#
# on-destroy companion of playbook.yaml. Self-contained: finds resources by
# name (name_prefix) and deletes them in reverse dependency order.
#
# Grain inputs (extra-vars): name_prefix, aws_region (same values as playbook.yaml)

- name: Delete AWS resources created by playbook.yaml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    prefix: "{{ name_prefix | default('torque-aws9') }}"
    aws_auth: &aws_auth
      region: "{{ aws_region | default('eu-west-1') }}"

  tasks:
    - name: Delete launch template
      amazon.aws.ec2_launch_template:
        <<: *aws_auth
        name: "{{ prefix }}-lt"
        state: absent
      tags: [compute, launch_template]

    - name: Delete placement group
      amazon.aws.ec2_placement_group:
        <<: *aws_auth
        name: "{{ prefix }}-pg"
        state: absent
      tags: [compute, placement_group]

    - name: Delete RDS instance parameter group
      amazon.aws.rds_instance_param_group:
        <<: *aws_auth
        name: "{{ prefix }}-db-params"
        state: absent
      tags: [database, rds_params]

    - name: Delete RDS cluster parameter group
      amazon.aws.rds_cluster_param_group:
        <<: *aws_auth
        name: "{{ prefix }}-cluster-params"
        state: absent
      tags: [database, rds_cluster_params]

    - name: Look up VPC
      amazon.aws.ec2_vpc_net_info:
        <<: *aws_auth
        filters:
          "tag:Name": "{{ prefix }}-vpc"
      register: vpc_info
      tags: [network, always]

    - name: Delete network resources
      when: vpc_info.vpcs | length > 0
      vars:
        vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
      block:
        - name: Delete egress-only internet gateway
          amazon.aws.ec2_vpc_egress_igw:
            <<: *aws_auth
            vpc_id: "{{ vpc_id }}"
            state: absent
          tags: [eigw]

        - name: Delete network ACL
          amazon.aws.ec2_vpc_nacl:
            <<: *aws_auth
            vpc_id: "{{ vpc_id }}"
            name: "{{ prefix }}-nacl"
            state: absent
          tags: [nacl]

        - name: Delete VPC
          amazon.aws.ec2_vpc_net:
            <<: *aws_auth
            vpc_id: "{{ vpc_id }}"
            state: absent
          tags: [vpc]
      tags: [network]
